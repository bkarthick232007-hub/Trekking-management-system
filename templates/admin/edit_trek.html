{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 600px;">
    <h3 class="mb-4">Edit Trek</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label>Trek Name</label>
            <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
        </div>
        <div class="mb-3">
            <label>Location</label>
            <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
        </div>
        <div class="mb-3">
            <label>Difficulty</label>
            <select name="difficulty" class="form-select" required>
                <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>
        <div class="mb-3">
            <label>Duration (days)</label>
            <input type="number" name="duration" class="form-control" value="{{ trek.duration }}" min="1" required>
        </div>
        <div class="mb-3">
            <label>Total Slots</label>
            <input type="number" name="total_slots" class="form-control" value="{{ trek.total_slots }}" min="1" required>
        </div>
        <div class="mb-3">
            <label>Start Date</label>
            <input type="date" name="start_date" class="form-control" value="{{ trek.start_date }}" required>
        </div>
        <div class="mb-3">
            <label>End Date</label>
            <input type="date" name="end_date" class="form-control" value="{{ trek.end_date }}" required>
        </div>
        <div class="mb-3">
            <label>Status</label>
            <select name="status" class="form-select" required>
                <option value="Pending" {% if trek.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Approved" {% if trek.status == 'Approved' %}selected{% endif %}>Approved</option>
                <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Trek</button>
    </form>
</div>

{% endblock %}
